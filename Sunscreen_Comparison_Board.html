<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKUScout • Sunscreen Marketplace & Competitive PDP Board</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #f8fafc;
            --grid-color: rgba(203, 213, 225, 0.45);
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --tdc-accent: #0284c7;
            --tdc-dark: #0369a1;
            --tdc-soft: #e0f2fe;
            --teal-header: #005f60;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-canvas);
            background-image: radial-gradient(var(--grid-color) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* Header Navigation */
        .board-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.05);
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-badge {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .board-heading {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Marketplace Selector Tabs */
        .marketplace-nav {
            padding: 14px 32px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
            background: #ffffff;
        }

        .mp-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .mp-pill:hover {
            border-color: var(--tdc-accent);
            color: var(--tdc-accent);
        }

        .mp-pill.active {
            background: #0284c7;
            color: #ffffff;
            border-color: #0284c7;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }

        .mp-pill.matrix-tab {
            background: #f0fdf4;
            color: #166534;
            border-color: #bbf7d0;
        }

        .mp-pill.matrix-tab.active {
            background: #005f60;
            color: #ffffff;
            border-color: #005f60;
        }

        /* Main Container */
        .board-container {
            max-width: 1700px;
            margin: 24px auto;
            padding: 0 24px;
        }

        .section-intro {
            background: #ffffff;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            padding: 18px 24px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-intro h2 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        /* Vertical Brand Stack (Miro Canvas Style) */
        .brand-canvas-row {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 20px 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px -3px rgba(0,0,0,0.03);
            transition: all 0.2s ease;
        }

        .brand-canvas-row.is-tdc {
            border-left: 6px solid #0284c7;
            background: #fafcff;
        }

        .row-meta-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f1f5f9;
        }

        .brand-title-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-name-tag {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .tdc-badge {
            background: #e0f2fe;
            color: #0369a1;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .comp-badge {
            background: #fef3c7;
            color: #92400e;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .meta-stats {
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .meta-stats span {
            background: #f1f5f9;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .pdp-jump-btn {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--tdc-accent);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #e0f2fe;
            background: #f0f9ff;
            transition: all 0.15s ease;
        }

        .pdp-jump-btn:hover {
            background: #0284c7;
            color: #ffffff;
        }

        /* Horizontal Carousel Gallery */
        .images-track {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 6px 2px 14px 2px;
            scroll-behavior: smooth;
        }

        .images-track::-webkit-scrollbar {
            height: 7px;
        }

        .images-track::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .image-card {
            flex: 0 0 auto;
            width: 155px;
            height: 155px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .image-card:hover {
            transform: scale(1.06);
            border-color: var(--tdc-accent);
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            z-index: 10;
        }

        .image-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .card-seq-tag {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(15, 23, 42, 0.75);
            color: #ffffff;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .card-label-tag {
            position: absolute;
            bottom: 4px;
            left: 4px;
            right: 4px;
            background: rgba(255, 255, 255, 0.95);
            color: #0f172a;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 4px;
            border-radius: 4px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            border: 1px solid #e2e8f0;
        }

        /* Verbatim Matrix Table View (Matching Image 2) */
        .matrix-table-container {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        .matrix-sub-header {
            background: #f8fafc;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .deep-matrix-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .deep-matrix-table th {
            background: var(--teal-header);
            color: #ffffff;
            font-weight: 700;
            padding: 12px 14px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .deep-matrix-table td {
            padding: 14px;
            border: 1px solid var(--border-color);
            vertical-align: top;
            line-height: 1.55;
            color: var(--text-primary);
        }

        .deep-matrix-table td.cat-cell {
            background: #f8fafc;
            font-weight: 800;
            text-align: center;
            vertical-align: middle;
            color: var(--text-secondary);
            width: 90px;
        }

        .deep-matrix-table td.field-cell {
            background: #f8fafc;
            font-weight: 700;
            color: var(--text-primary);
            width: 170px;
        }

        /* Lightbox Modal */
        .lightbox-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .lightbox-modal.open {
            display: flex;
        }

        .lightbox-img {
            max-width: 82vw;
            max-height: 82vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .lightbox-close {
            position: absolute;
            top: 24px;
            right: 32px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            font-size: 2rem;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

        let currentMp = 'Amazon';

        function switchMarketplace(mpKey) {
            currentMp = mpKey;
            
            // Update active pill styling
            document.querySelectorAll('.mp-pill').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.includes(mpKey) || (mpKey === 'TDC_AQUA_MATRIX' && btn.innerText.includes('Aqua Gel Verbatim')) || (mpKey === 'TDC_MATTE_MATRIX' && btn.innerText.includes('Matte Gel Verbatim')) || (mpKey === 'Brand D2C Store' && btn.innerText.includes('D2C'))) {
                    btn.classList.add('active');
                }
            });

            const mpView = document.getElementById('marketplaceView');
            const matrixView = document.getElementById('verbatimMatrixView');

            if (mpKey === 'TDC_AQUA_MATRIX') {
                mpView.style.display = 'none';
                matrixView.style.display = 'block';
                renderVerbatimMatrix(aquaMatrix);
            } else if (mpKey === 'TDC_MATTE_MATRIX') {
                mpView.style.display = 'none';
                matrixView.style.display = 'block';
                renderVerbatimMatrix(matteMatrix);
            } else {
                matrixView.style.display = 'none';
                mpView.style.display = 'block';
                renderMarketplaceView(mpKey);
            }
        }

        function renderMarketplaceView(mpKey) {
            const data = mpData[mpKey];
            if (!data) return;

            const introBar = document.getElementById('mpIntroBar');
            introBar.innerHTML = `
                <div>
                    <h2>${data.title}</h2>
                    <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px;">
                        Comparing uploaded packshots and A+ graphics vertically across all brands in exact upload sequence.
                    </p>
                </div>
                <span class="brand-badge" style="background:#0f172a;">${data.brands.length} Brands Tracked</span>
            `;

            const container = document.getElementById('brandsContainer');
            container.innerHTML = '';

            data.brands.forEach((b, idx) => {
                const row = document.createElement('div');
                row.className = `brand-canvas-row ${b.is_tdc ? 'is-tdc' : ''}`;
                row.innerHTML = `
                    <div class="row-meta-bar">
                        <div class="brand-title-wrap">
                            <span class="brand-name-tag">${b.brand}</span>
                            <span style="font-size:0.9rem; font-weight:600; color:var(--text-secondary);">${b.product}</span>
                            <span class="${b.is_tdc ? 'tdc-badge' : 'comp-badge'}">${b.is_tdc ? '🌟 THE DERMA CO' : '⚔️ COMPETITOR'}</span>
                        </div>
                        <div class="meta-stats">
                            <span>Selling: ${b.price} <del style="color:#94a3b8;">${b.mrp}</del></span>
                            <span>${b.rating}</span>
                            <a href="${b.pdp_url}" target="_blank" class="pdp-jump-btn">Open ${mpKey} PDP ↗</a>
                        </div>
                    </div>
                    <div class="images-track">
                        ${b.images.map((img, i) => `
                            <div class="image-card" onclick="openLightbox('${img.url}')">
                                <span class="card-seq-tag">#${i+1}</span>
                                <img src="${img.url}" alt="${b.brand} Image ${i+1}" loading="lazy" onerror="this.src='https://placehold.co/155x155?text=Image+${i+1}'">
                                <span class="card-label-tag" title="${img.label}">${img.label}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(row);
            });
        }

        function renderVerbatimMatrix(matrixData) {
            document.getElementById('matrixTitle').innerText = matrixData.product_name + " — Verbatim PDP Content Matrix";
            const table = document.getElementById('matrixTable');
            table.innerHTML = `
                <thead>
                    <tr>
                        <th style="width: 100px;">Category</th>
                        <th style="width: 180px;">Content Field</th>
                        ${matrixData.marketplaces.map(m => `<th style="width: 260px;">${m}</th>`).join('')}
                    </tr>
                </thead>
                <tbody>
                    ${matrixData.fields.map((f, idx) => `
                        <tr>
                            ${idx === 0 ? `<td class="cat-cell" rowspan="${matrixData.fields.length}">Website</td>` : ''}
                            <td class="field-cell">${f.field}</td>
                            ${matrixData.marketplaces.map(m => `
                                <td>${f.values[m] || '—'}</td>
                            `).join('')}
                        </tr>
                    `).join('')}
                </tbody>
            `;
        }

        // Lightbox functions
        function openLightbox(src) {
            const modal = document.getElementById('lightboxModal');
            const img = document.getElementById('lightboxImg');
            img.src = src;
            modal.classList.add('open');
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').classList.remove('open');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        // Load Default View
        renderMarketplaceView('Amazon');
